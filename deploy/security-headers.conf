# Keep in sync with public/_headers (Cloudflare Pages). Included in every
# location that sets its own add_header, because nginx drops inherited
# add_header directives as soon as a nested block declares one.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
