# Static cvargas.com (Astro dist/) behind a cloudflared tunnel.
# Copy deploy/security-headers.conf to /etc/nginx/snippets/ alongside this file.
server {
    listen 80;
    listen [::]:80;
    server_name cvargas.com www.cvargas.com;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # TLS terminates at Cloudflare; the tunnel connects to this plain-HTTP listener.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               application/json image/svg+xml application/manifest+json;

    error_page 404 /404.html;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hashed build assets: cache forever.
    location /_astro/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }
}
